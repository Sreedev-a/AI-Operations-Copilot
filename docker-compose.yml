services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operations_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: local_demo_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      AI_MODE: demo
      DATABASE_URL: postgresql://copilot:local_demo_only@postgres:5432/operations_copilot
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:

