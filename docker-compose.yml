services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operations_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: local_demo_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d operations_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI_MODE: demo
      DATABASE_URL: postgresql://copilot:local_demo_only@postgres:5432/operations_copilot
      EVALUATIONS_DIR: /app/evaluations
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
